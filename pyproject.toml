[project]
name = "weather-mcp"
version = "0.1.0"
description = "Weather (Open-Meteo, no API key) exposed as MCP tools — structured data for the LLM AND a rendered card image via an out-of-band capability link"
readme = "README.md"
authors = [
    { name = "Daniel Nunez", email = "danmarce@gmail.com" }
]
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2",
    "truststore>=0.10.5",
    "uvicorn>=0.54.0",
    "pillow>=11.0",
]

[project.scripts]
weather-mcp = "weather_mcp:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
